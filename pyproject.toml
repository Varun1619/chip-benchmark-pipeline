[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-benchmark-pipeline"
version = "0.1.0"
description = "Streaming pipeline for synthetic chip and system benchmark telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Varun Singh" }]
keywords = ["data-engineering", "streaming", "kafka", "spark", "dbt", "duckdb"]

# Shared by every service. Each service adds only what it needs through an
# extra, so the container images stay independent of one another.
dependencies = [
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
producer = [
  "confluent-kafka>=2.6,<3.0",
]
consumer = [
  "pyspark==3.5.3",
]
analytics = [
  "dbt-core>=1.8,<2.0",
  "dbt-duckdb>=1.8,<2.0",
  "duckdb>=1.1,<2.0",
]
dashboard = [
  "streamlit>=1.39,<2.0",
  "duckdb>=1.1,<2.0",
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<7.0",
]
dev = [
  "ruff>=0.7,<1.0",
  "mypy>=1.12,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<8.0",
]

[project.urls]
Repository = "https://github.com/Varun1619/chip-benchmark-pipeline"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*", "producer*", "consumer*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/dbt_project/target", "src/dbt_project/dbt_packages"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8 naming
  "D",    # docstrings
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "PTH",  # prefer pathlib
  "RET",  # return statements
  "ARG",  # unused arguments
  "TID",  # tidy imports
]
ignore = [
  "D107",  # __init__ docstring lives on the class
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ARG001"]
# The catalogues are reference tables. Aligned rows read better than one
# field per line, which costs a few long lines and nothing else.
"src/producer/catalog.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
pretty = true

# Neither PySpark nor the Streamlit ecosystem ships complete stubs. Both the
# bare name and the wildcard are listed, because a wildcard alone does not
# match the top level module.
[[tool.mypy.overrides]]
module = [
  "pyspark", "pyspark.*",
  "confluent_kafka", "confluent_kafka.*",
  "streamlit", "streamlit.*",
  "plotly", "plotly.*",
  "duckdb", "duckdb.*",
]
ignore_missing_imports = true

# Do not descend into these packages' own stubs. The numpy stubs use `type`
# statements, which are 3.12 syntax, so parsing them fails the whole run while
# saying nothing about this project's code.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs a running service such as Redpanda or Spark",
]
