name: ci

on:
  pull_request:
    branches: [main]
  # Phase branches run the same checks before a pull request exists, so a
  # failure surfaces on the branch that caused it.
  push:
    branches: [main, "feat/**", "fix/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 matches the container images. PySpark 3.5 does not support 3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Spark 3.5 supports Java 8, 11 and 17. The consumer tests run a real
      # local session, so the JVM has to be here and has to be 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The producer extra is needed because the publisher tests import the
      # Kafka client module before replacing it with a fake. The consumer extra
      # brings PySpark for the transform tests.
      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,producer,consumer]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
